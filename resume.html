<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - GetReady</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="resume.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Resume Builder</h1>
        <a href="index.html" class="back-to-main-app">← Back to GetReady</a>
    </header>

    <main>
        <div id="resume-form-container">
            <form id="resume-form">
                <section id="personal-info">
                    <h2>Personal Information</h2>
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address">
                    </div>
                </section>

                <section id="work-experience">
                    <h2>Work Experience</h2>
                    <div id="work-experience-entries">
                        <!-- JS will add entries here -->
                    </div>
                    <button type="button" id="add-experience" class="btn-add">Add Experience</button>
                </section>

                <section id="education">
                    <h2>Education</h2>
                    <div id="education-entries">
                        <!-- JS will add entries here -->
                    </div>
                    <button type="button" id="add-education" class="btn-add">Add Education</button>
                </section>

                <section id="skills">
                    <h2>Skills</h2>
                    <div class="form-group">
                        <label for="skills-input">Skills (comma-separated)</label>
                        <input type="text" id="skills-input">
                    </div>
                </section>

                <button type="submit" class="btn-submit">Generate Resume</button>
            </form>
        </div>

        <div id="resume-preview-container">
            <h2>Preview</h2>
            <div id="resume-preview">
                <!-- JS will populate this area -->
            </div>
            <button id="download-pdf" class="btn-download">Download as PDF</button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="resume.js"></script>
</body>
</html>
