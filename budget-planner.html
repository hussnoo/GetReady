<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner - GetReady</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="budget-planner.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Budget Planner</h1>
        <a href="index.html" class="back-to-main-app">← Back to GetReady</a>
    </header>

    <main>
        <div id="budget-container">
            <div id="summary">
                <h2>Summary</h2>
                <div class="summary-card">
                    <h3>Total Income</h3>
                    <p id="total-income">Rp 0</p>
                </div>
                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">Rp 0</p>
                </div>
                <div class="summary-card">
                    <h3>Balance</h3>
                    <p id="balance">Rp 0</p>
                </div>
            </div>

            <div id="add-transaction">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Add Transaction</button>
                </form>
            </div>

            <div id="transaction-history">
                <h2>Transaction History</h2>
                <div id="income-list" class="transaction-list">
                    <h3>Income</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="income-table-body">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
                <div id="expense-list" class="transaction-list">
                    <h3>Expenses</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="budget-planner.js"></script>
</body>
</html>
