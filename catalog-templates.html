<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Templates - GetReady</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="catalog-templates.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Catalog Templates</h1>
        <a href="index.html" class="back-to-main-app">← Back to GetReady</a>
    </header>

    <main>
        <div class="template-gallery">
            <div class="template-card">
                <img src="catalog-thumb-1.png" alt="Catalog Template 1 Thumbnail">
                <h3>Product Catalog</h3>
                <p>A clean and modern product catalog.</p>
                <a href="catalog-1.pdf" class="btn-download" download>Download PDF</a>
            </div>
            <div class="template-card">
                <img src="catalog-thumb-2.png" alt="Catalog Template 2 Thumbnail">
                <h3>Fashion Lookbook</h3>
                <p>A stylish lookbook for a fashion brand.</p>
                <a href="catalog-2.pdf" class="btn-download" download>Download PDF</a>
            </div>
            <div class="template-card">
                <img src="catalog-thumb-3.png" alt="Catalog Template 3 Thumbnail">
                <h3>Service Catalog</h3>
                <p>A professional catalog for service-based businesses.</p>
                <a href="catalog-3.pdf" class="btn-download" download>Download PDF</a>
            </div>
        </div>
    </main>
</body>
</html>
