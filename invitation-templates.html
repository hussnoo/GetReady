<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <header>

        <a href="index.html" class="back-to-main-app">← Back to GetReady</a>

    <main>
        <div class="template-gallery">

            </div>
            <div class="template-card">
                <img src="invitation-thumb-3.png" alt="Invitation Template 3 Thumbnail">

                <a href="invitation-3.pdf" class="btn-download" download>Download PDF</a>
            </div>
